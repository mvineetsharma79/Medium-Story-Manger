<div class="modal fade" id="statsDashboardModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white py-2">
                <h5 class="modal-title"><i class="bi bi-graph-up"></i> Medium Stats Dashboard</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-2" id="statsDashboardContent">
                <div class="text-center py-3">
                    <div class="spinner-border text-primary"></div>
                    <p class="mt-2">Loading stats...</p>
                </div>
            </div>
            <div class="modal-footer py-2">
                <div class="me-auto">
                    <small class="text-muted" id="statsMonthIndicator"></small>
                </div>
                <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-sm btn-primary" id="refreshStatsBtn">Refresh from Medium</button>
            </div>
        </div>
    </div>
</div>
