<div class="modal fade" id="statsDashboardModal" tabindex="-1" aria-labelledby="statsDashboardModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white py-2">
                <h5 class="modal-title" id="statsDashboardModalLabel">
                    <i class="bi bi-graph-up"></i> Medium Stats Dashboard
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-2" id="statsDashboardContent">
