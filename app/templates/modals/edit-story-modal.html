<!-- Edit Story Modal -->
<div class="modal fade" id="editStoryModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">
                    <i class="bi bi-pencil-square"></i> Edit Story
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editStoryUniqueSlug">
                
                <div class="row g-2 mb-2">
                    <div class="col-md-6">
                        <label class="form-label small">Title</label>
                        <input type="text" id="editStoryTitle" class="form-control form-control-sm">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small">Status</label>
                        <select id="editStoryStatus" class="form-select form-select-sm">
                            <option value="Draft">Draft</option>
                            <option value="Ready">Ready</option>
                            <option value="Done">Done</option>
                            <option value="Published">Published</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small">Series</label>
                        <input type="text" id="editStorySeries" class="form-control form-control-sm" placeholder="Series name">
                    </div>
                </div>
                
                <div class="row g-2 mb-2">
                    <div class="col-md-3">
                        <label class="form-label small">Created Date</label>
                        <input type="date" id="editStoryCreatedDate" class="form-control form-control-sm">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small">Published Date</label>
                        <input type="date" id="editStoryPublishedDate" class="form-control form-control-sm">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small">Medium URL</label>
                        <input type="url" id="editStoryMediumUrl" class="form-control form-control-sm">
                    </div>
                </div>
                
                <div class="mb-2">
                    <label class="form-label small">Tags</label>
                    <input type="text" id="editStoryTags" class="form-control form-control-sm" placeholder="tag1, tag2, tag3">
                </div>
                
                <div class="mb-2">
                    <label class="form-label small">Notes</label>
                    <textarea id="editStoryNotes" class="form-control form-control-sm" rows="2"></textarea>
                </div>
                
                <hr>
                <h6 class="small">LinkedIn Marketing</h6>
                
                <div class="row g-2">
                    <div class="col-md-3">
                        <label class="form-label small">Status</label>
                        <select id="editStoryLinkedinStatus" class="form-select form-select-sm">
                            <option value="">Not Posted</option>
                            <option value="scheduled">Scheduled</option>
                            <option value="posted">Posted</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small">Timestamp</label>
                        <input type="datetime-local" id="editStoryLinkedinTimestamp" class="form-control form-control-sm">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small">Impressions</label>
                        <input type="number" id="editStoryLinkedinImpressions" class="form-control form-control-sm" value="0">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small">Post URL</label>
                        <input type="url" id="editStoryLinkedinUrl" class="form-control form-control-sm">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveStoryEditBtn">Save Changes</button>
            </div>
        </div>
    </div>
</div>
