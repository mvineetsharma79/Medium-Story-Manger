<div class="modal fade" id="addStoryModal" tabindex="-1" aria-labelledby="addStoryModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-light">
                <h5 class="modal-title" id="addStoryModalLabel">
                    <i class="bi bi-plus-circle"></i> Add New Story
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="addStoryForm">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Story Name</label>
                        <input type="text" class="form-control" id="addStoryName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Series (Folder)</label>
                        <select class="form-select" id="addStorySeries">
                            <option value="">Create in root (no series)</option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Read Time (min)</label>
                                <input type="number" class="form-control" id="addStoryReadTime">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Tags</label>
                                <input type="text" class="form-control" id="addStoryTags" placeholder="python, tutorial">
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Local Created Date</label>
                        <div class="date-input-group">
                            <input type="date" class="form-control" id="addStoryCreatedDate">
                            <button type="button" class="btn btn-sm btn-outline-secondary" id="addStorySetTodayBtn">Today</button>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-sm btn-primary" id="addStoryCreateBtn">Create Story</button>
            </div>
        </div>
    </div>
</div>
