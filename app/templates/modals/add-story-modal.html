<div class="modal fade" id="addStoryModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-light">
                <h5 class="modal-title">Add New Story</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-2">
                    <label class="form-label">Story Name *</label>
                    <input type="text" id="addStoryName" class="form-control">
                </div>
                <div class="mb-2">
                    <label class="form-label">Series</label>
                    <select id="addStorySeries" class="form-select">
                        <option value="">None</option>
                    </select>
                </div>
                <div class="mb-2">
                    <label class="form-label">Tags</label>
                    <input type="text" id="addStoryTags" class="form-control" placeholder="python, tutorial">
                </div>
                <div class="mb-2">
                    <label class="form-label">Read Time (minutes)</label>
                    <input type="number" id="addStoryReadTime" class="form-control">
                </div>
                <div class="mb-2">
                    <label class="form-label">Created Date</label>
                    <input type="date" id="addStoryCreatedDate" class="form-control">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="createStory()">Create</button>
            </div>
        </div>
    </div>
</div>
