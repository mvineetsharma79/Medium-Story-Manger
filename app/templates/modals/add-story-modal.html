<!-- Add Story Modal -->
<div class="modal fade" id="addStoryModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">
                    <i class="bi bi-plus-lg"></i> Add New Story
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-2">
                    <label class="form-label small">Title *</label>
                    <input type="text" id="addStoryTitle" class="form-control form-control-sm">
                </div>
                <div class="mb-2">
                    <label class="form-label small">Series</label>
                    <select id="addStorySeries" class="form-select form-select-sm">
                        <option value="">None</option>
                    </select>
                </div>
                <div class="mb-2">
                    <label class="form-label small">Created Date</label>
                    <input type="date" id="addStoryCreatedDate" class="form-control form-control-sm">
                </div>
                <div class="mb-2">
                    <label class="form-label small">Medium URL</label>
                    <input type="url" id="addStoryMediumUrl" class="form-control form-control-sm">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="addStoryCreateBtn">Create</button>
            </div>
        </div>
    </div>
</div>
