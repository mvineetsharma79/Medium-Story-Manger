<div id="storyStatsWidget" class="story-stats-widget card mb-3">
    <div class="card-header bg-primary text-white p-2" id="statsWidgetHeader">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <i class="bi bi-graph-up"></i>
                <strong>Monthly Analytics</strong>
                <span class="ms-2" id="statsPeriodDisplay">Loading...</span>
            </div>
            <div class="d-flex gap-2" onclick="event.stopPropagation()">
                <select id="statsYearSelect" class="form-select form-select-sm" style="width: 80px;">
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                </select>
                <select id="statsMonthSelect" class="form-select form-select-sm" style="width: 110px;">
                    <option value="1">January</option>
                    <option value="2">February</option>
                    <option value="3">March</option>
                    <option value="4">April</option>
                    <option value="5">May</option>
                    <option value="6">June</option>
                    <option value="7">July</option>
                    <option value="8">August</option>
                    <option value="9">September</option>
                    <option value="10">October</option>
                    <option value="11">November</option>
                    <option value="12">December</option>
                </select>
                <button class="btn btn-sm btn-light" id="statsRefreshBtn" title="Refresh">
                    <i class="bi bi-arrow-repeat"></i>
                </button>
                <button class="btn btn-sm btn-light" id="statsSyncBtn" title="Sync from Medium">
                    <i class="bi bi-cloud-download"></i>
                </button>
                <i class="bi bi-chevron-down collapse-icon"></i>
            </div>
        </div>
    </div>
    <div id="statsWidgetBody" class="card-body collapse">
        <!-- Stats in a single horizontal line -->
        <div class="stats-inline-container">
            <div class="stat-item" data-full-number="0" id="statPresentations">
                <i class="bi bi-display"></i>
                <span class="stat-label">Presentations</span>
                <span class="stat-value presentations">-</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item" data-full-number="0" id="statViewers">
                <i class="bi bi-eye"></i>
                <span class="stat-label">Viewers</span>
                <span class="stat-value viewers">-</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item" data-full-number="0" id="statReaders">
                <i class="bi bi-book"></i>
                <span class="stat-label">Readers</span>
                <span class="stat-value readers">-</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item" data-full-number="0" id="statFollowers">
                <i class="bi bi-people"></i>
                <span class="stat-label">Followers</span>
                <span class="stat-value followers">-</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item" data-full-number="0" id="statSubscribers">
                <i class="bi bi-envelope-paper"></i>
                <span class="stat-label">Subscribers</span>
                <span class="stat-value subscribers">-</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item" data-full-number="0" id="statReadRatio">
                <i class="bi bi-pie-chart"></i>
                <span class="stat-label">Read Ratio</span>
                <span class="stat-value read-ratio">-</span>
            </div>
        </div>
        
        <!-- Chart -->
        <div class="chart-container" style="position: relative; height: 280px; margin-top: 0.75rem;">
            <canvas id="monthlyStatsChart"></canvas>
        </div>
        
        <div class="loading-overlay text-center py-3" style="display: none;">
            <div class="spinner-border text-primary" role="status"></div>
            <p>Loading stats...</p>
        </div>
        <div class="error-message alert alert-danger mt-2" style="display: none;"></div>
    </div>
</div>
