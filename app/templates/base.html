<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Manager - {% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/calendar.css">

    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/story-stats-widget.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Widget JS -->
    <script src="/static/js/story-stats-widget.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar with toggle button inside -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">📚 Story Manager</div>
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard" class="nav-item" data-view="dashboard">
                    <i class="bi bi-speedometer2"></i> <span>Dashboard</span>
                </a>
                <a href="/stories" class="nav-item" data-view="stories">
                    <i class="bi bi-files"></i> <span>Stories</span>
                </a>
                <a href="/series" class="nav-item" data-view="series">
                    <i class="bi bi-collection"></i> <span>Series</span>
                </a>
                <a href="/calendar" class="nav-item" data-view="calendar">
                    <i class="bi bi-calendar-week"></i> <span>Calendar</span>
                </a>
                <a href="/settings" class="nav-item" data-view="settings">
                    <i class="bi bi-gear"></i> <span>Settings</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="mode-selector" id="modeSelector"></div>
                <div class="leaderboard-stats">
                    <div><i class="bi bi-trophy"></i> <span id="leaderboardCount">0</span> stories</div>
                    <div><i class="bi bi-currency-dollar"></i> $<span id="leaderboardAmount">0.00</span></div>
                </div>
                <div class="last-fetch">
                    <i class="bi bi-cloud-check"></i> <span id="lastFetchTime">Never</span>
                </div>
            </div>

            <!-- Toggle Button INSIDE sidebar -->
            <button class="sidebar-toggle" id="sidebarToggle" title="Collapse/Expand Sidebar">
                <i class="bi bi-chevron-left" id="toggleIcon"></i>
            </button>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div id="loading" class="loading-spinner" style="display: none;">
                <div class="spinner-border text-primary"></div>
            </div>
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Modals -->
    {% include "modals/add-story-modal.html" %}
    {% include "modals/edit-story-modal.html" %}
    {% include "modals/stats-modal.html" %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/app.js"></script>

    <!-- Sidebar Collapse Script -->
    <script>
        (function () {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('sidebarToggle');
            const toggleIcon = document.getElementById('toggleIcon');

            // Load saved state from localStorage
            const isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';

            if (isCollapsed && sidebar) {
                sidebar.classList.add('collapsed');
                if (toggleIcon) toggleIcon.classList.replace('bi-chevron-left', 'bi-chevron-right');
            }

            if (toggleBtn) {
                toggleBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    sidebar.classList.toggle('collapsed');
                    const nowCollapsed = sidebar.classList.contains('collapsed');

                    // Save state
                    localStorage.setItem('sidebarCollapsed', nowCollapsed);

                    // Change icon direction
                    if (toggleIcon) {
                        if (nowCollapsed) {
                            toggleIcon.classList.remove('bi-chevron-left');
                            toggleIcon.classList.add('bi-chevron-right');
                        } else {
                            toggleIcon.classList.remove('bi-chevron-right');
                            toggleIcon.classList.add('bi-chevron-left');
                        }
                    }

                    // Trigger window resize event for any components that need to adjust
                    setTimeout(() => {
                        window.dispatchEvent(new Event('resize'));
                    }, 100);
                });
            }
        })();
    </script>

    {% block scripts %}{% endblock %}
</body>

</html>
