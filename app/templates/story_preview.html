<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Preview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: #f5f7fa;
            padding: 20px;
        }
        .story-container { max-width: 1400px; margin: 0 auto; }
        .info-card { background: #f8f9fa; border-radius: 8px; padding: 10px 15px; height: 100%; }
        .markdown-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; line-height: 1.6; }
        .markdown-body h1 { font-size: 2em; border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; }
        .markdown-body h2 { font-size: 1.5em; border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; }
        .markdown-body code { background: #f6f8fa; padding: 0.2em 0.4em; border-radius: 3px; }
        .markdown-body pre { background: #f6f8fa; padding: 16px; border-radius: 6px; overflow-x: auto; }
        .status-badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 0.7rem; font-weight: 500; }
        .status-published { background: #27ae60; color: white; }
        .status-published-due { background: #fd7e14; color: white; }
        .status-ready { background: #3498db; color: white; }
        .status-done { background: #9b59b6; color: white; }
        .status-draft { background: #f39c12; color: white; }
        #loadingOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<div id="storyPreviewContainer" data-story-key="{{ story_key }}" class="story-container">
    <div class="card mb-3">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0"><i class="bi bi-file-text"></i> <span id="storyTitle">Loading...</span></h4>
            <div>
                <button class="btn btn-sm btn-light me-2" onclick="toggleViewMode()"><i class="bi bi-code-slash"></i> Source</button>
                <button class="btn btn-sm btn-success me-2" onclick="saveStory()"><i class="bi bi-save"></i> Save</button>
                <button class="btn btn-sm btn-secondary" onclick="window.close()"><i class="bi bi-x-lg"></i> Close</button>
            </div>
        </div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3"><div class="info-card"><small class="text-muted">📅 Created</small><div class="fw-bold" id="storyCreatedDate">-</div></div></div>
                <div class="col-md-3"><div class="info-card"><small class="text-muted">📁 Series</small><div class="fw-bold" id="storySeries">-</div></div></div>
                <div class="col-md-3"><div class="info-card"><small class="text-muted">📋 Status</small><div id="storyStatus">-</div></div></div>
                <div class="col-md-3"><div class="info-card"><small class="text-muted">📅 Published</small><div class="fw-bold" id="storyPublishedDate">-</div></div></div>
            </div>
            <div class="row g-3 mt-2">
                <div class="col-md-6"><div class="info-card"><small class="text-muted">⏰ Due Date</small><div id="storyDueDate">-</div></div></div>
                <div class="col-md-6"><div class="info-card"><small class="text-muted">📄 File Path</small><div class="small" id="storyFilePath">-</div></div></div>
            </div>
            <div class="row g-3 mt-2">
                <div class="col-md-6"><div class="info-card"><small class="text-muted">📝 Notes</small><div id="storyNotes">-</div></div></div>
                <div class="col-md-6"><div class="info-card"><small class="text-muted">🏷️ Tags</small><div id="storyTags">-</div></div></div>
            </div>
        </div>
    </div>
    
    <div class="card">
        <div class="card-header">
            <ul class="nav nav-tabs card-header-tabs">
                <li class="nav-item"><button class="nav-link active" id="preview-tab" data-bs-toggle="tab" data-bs-target="#preview">👁️ Preview</button></li>
                <li class="nav-item"><button class="nav-link" id="source-tab" data-bs-toggle="tab" data-bs-target="#source">📝 Source</button></li>
            </ul>
        </div>
        <div class="card-body p-0">
            <div class="tab-content">
                <div class="tab-pane fade show active" id="preview" role="tabpanel">
                    <div id="previewContent" class="markdown-body p-3" style="min-height: 500px; max-height: 70vh; overflow-y: auto;"><div class="text-center py-5"><div class="spinner-border text-primary"></div><p>Loading...</p></div></div>
                </div>
                <div class="tab-pane fade" id="source" role="tabpanel">
                    <textarea id="sourceContent" class="form-control font-monospace" style="min-height: 500px; max-height: 70vh; font-family: monospace; font-size: 13px; resize: vertical; border: none; border-radius: 0;"></textarea>
                </div>
            </div>
        </div>
    </div>
</div>
<div id="loadingOverlay"><div class="bg-white p-4 rounded shadow text-center"><div class="spinner-border text-primary"></div><p class="mt-2 mb-0">Loading...</p></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/story-preview.js"></script>
</body>
</html>
