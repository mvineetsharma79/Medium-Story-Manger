events {
    worker_connections 1024;
}

http {
    upstream story-manager {
        server story-manager-prod:8000;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://story-manager;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static {
            alias /app/static;
            expires 30d;
        }

        location /health {
            proxy_pass http://story-manager/health;
            access_log off;
        }
    }
}