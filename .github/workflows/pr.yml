name: PR - Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [ main ]

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$TITLE" =~ ^(feat|fix|docs|style|refactor|test|chore)(\([a-z]+\))?: ]]; then
            echo "❌ PR title must follow Conventional Commits format"
            echo "Example: feat: add new feature"
            echo "         fix: resolve bug"
            exit 1
          fi

      - name: Run Python tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install -r requirements.txt pytest
          pytest tests/ -v

      - name: Run Docker build test
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: story-manager:pr-test

      - name: Add PR comment with preview
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ PR validation passed! Ready for review.'
            })